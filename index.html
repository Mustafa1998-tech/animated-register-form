<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register Now | Animated Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="stage">
    <div class="scene" id="scene">

      <!-- ===== Character ===== -->
      <div class="character" id="character" aria-hidden="true">
        <div class="shadow" id="shadow"></div>
        <svg viewBox="0 0 200 420" class="char-svg">
          <defs>
            <pattern id="stripes" width="7" height="10" patternUnits="userSpaceOnUse">
              <rect width="7" height="10" fill="#3c5558" />
              <rect x="0" width="2" height="10" fill="#8fa6a3" />
              <rect x="4" width="1" height="10" fill="#2a3d40" />
            </pattern>
            <linearGradient id="skin" x1="0" x2="1">
              <stop offset="0" stop-color="#b9774f" />
              <stop offset="1" stop-color="#d79b72" />
            </linearGradient>
            <linearGradient id="pants" x1="0" x2="1">
              <stop offset="0" stop-color="#121212" />
              <stop offset=".6" stop-color="#2a2624" />
              <stop offset="1" stop-color="#171514" />
            </linearGradient>
            <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9a6a48" />
              <stop offset="1" stop-color="#5e3a22" />
            </linearGradient>
          </defs>

          <g id="body">
            <!-- back leg -->
            <g id="thighB" class="leg back">
              <path d="M84 206 h22 l-1 108 h-19 z" fill="url(#pants)" />
              <g id="shinB">
                <path d="M86 306 h19 l-1 86 h-16 z" fill="url(#pants)" />
                <path d="M85 388 h21 c10 0 22 4 24 11 c1 4-2 6-6 6 h-38 c-3 0-4-2-4-5 z" fill="url(#shoe)" />
                <path d="M82 402 h48" stroke="#3b2414" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>

            <!-- torso -->
            <g id="torso">
              <!-- back arm -->
              <g id="armB">
                <path d="M78 114 c-8 2-11 10-10 18 l2 26 h20 l2-30 c0-8-6-15-14-14z" fill="url(#stripes)" />
                <path d="M73 154 h15 l-1 30 h-13 z" fill="url(#skin)" />
                <g id="foreB">
                  <path d="M74 180 h13 l-1 52 h-11 z" fill="url(#skin)" />
                  <ellipse cx="80" cy="238" rx="9" ry="10" fill="#c88762" />
                </g>
              </g>

              <path d="M74 118 c4-12 16-16 28-16 c14 0 26 4 30 16 l-6 92 h-48 z" fill="url(#stripes)" />
              <path d="M78 120 c2 30 2 60 4 90 h-4 z" fill="#000" opacity=".18" />
              <path d="M92 104 l10 14 l10-14 l8 4 l-7 14 l-11-6 l-11 6 l-7-14z" fill="#33494c" />
              <rect x="77" y="204" width="50" height="9" rx="2" fill="#6b4126" />
              <rect x="108" y="203" width="9" height="11" rx="2" fill="none" stroke="#c9a15b" stroke-width="2" />
              <path d="M79 213 h47 l-2 18 h-43 z" fill="url(#pants)" />

              <!-- head -->
              <g id="head">
                <path d="M93 86 h20 v22 h-20z" fill="#b5734c" />
                <ellipse cx="103" cy="60" rx="31" ry="37" fill="url(#skin)" />
                <ellipse cx="74" cy="64" rx="6" ry="9" fill="#b06d48" />
                <path d="M73 52 c-2-22 14-34 32-34 c18 0 30 10 30 26 c-6-8-16-10-26-9 c-14 1-26 6-30 18 c-2 0-4 1-6-1z" fill="#2b2826" />
                <path d="M74 50 c0 8 1 14 3 18 l2-14z" fill="#3d3835" />
                <path d="M86 92 c8 8 24 8 34-2 c-2 10-12 16-20 16 c-8 0-12-6-14-14z" fill="#6e4430" opacity=".45" />
                <!-- sunglasses -->
                <path d="M86 58 h18 c1 8-3 13-9 13 c-6 0-9-5-9-13z" fill="#111" />
                <path d="M110 58 h18 c1 8-3 13-9 13 c-6 0-9-5-9-13z" fill="#111" />
                <path d="M104 60 h6" stroke="#111" stroke-width="2.5" />
                <path d="M86 59 l-8-2" stroke="#111" stroke-width="2.5" />
                <path d="M89 61 l4-1" stroke="#fff" stroke-width="1.5" opacity=".5" />
                <path d="M113 61 l4-1" stroke="#fff" stroke-width="1.5" opacity=".5" />
                <!-- eyebrows -->
                <path d="M87 52 q8-4 16 0 M111 52 q8-4 16 0" stroke="#231f1d" stroke-width="3" fill="none" stroke-linecap="round" />
                <!-- nose -->
                <path d="M119 66 c3 4 5 9 2 12 c-2 1-5 1-7 0" fill="#b06d48" />
                <!-- moustache -->
                <path d="M103 82 c5-5 18-5 22 0 c-3 3-6 3-11 1 c-4 2-8 2-11-1z" fill="#2b2826" />
                <path d="M107 89 q6 3 12 0" stroke="#7a3d2a" stroke-width="2" fill="none" stroke-linecap="round" />
              </g>

              <!-- front arm -->
              <g id="armF">
                <path d="M122 114 c8 2 11 10 10 18 l-2 26 h-20 l-2-30 c0-8 6-15 14-14z" fill="url(#stripes)" />
                <path d="M112 154 h15 l-1 30 h-13 z" fill="url(#skin)" />
                <g id="foreF">
                  <path d="M113 180 h13 l-1 52 h-11 z" fill="url(#skin)" />
                  <ellipse cx="119" cy="238" rx="9" ry="10" fill="#d1906a" />
                </g>
              </g>
            </g>

            <!-- front leg -->
            <g id="thighF" class="leg front">
              <path d="M96 206 h22 l-1 108 h-19 z" fill="url(#pants)" />
              <g id="shinF">
                <path d="M98 306 h19 l-1 86 h-16 z" fill="url(#pants)" />
                <path d="M97 388 h21 c10 0 22 4 24 11 c1 4-2 6-6 6 h-38 c-3 0-4-2-4-5 z" fill="url(#shoe)" />
                <path d="M94 402 h48" stroke="#3b2414" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>
          </g>
        </svg>
      </div>

      <!-- ===== Form ===== -->
      <form class="card" id="card" novalidate>
        <h1>Register Now</h1>
        <p class="sub">Fill in this form to participate in our online workshop (Event name)</p>

        <div class="field" data-field="first">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-7 8-7s8 3 8 7" /></svg>
          <input type="text" id="first" placeholder="First Name" autocomplete="given-name" />
          <svg class="warn" viewBox="0 0 24 24"><path d="M12 3 2 21h20z" /><path d="M12 10v5M12 18v.5" /></svg>
          <span class="msg">Field is required</span>
        </div>

        <div class="field" data-field="last">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="8" r="4" /><path d="M3 21c0-4 4-7 8-7 2 0 3 .3 4 .8" /><path d="M18 3v4M16 5h4" /></svg>
          <input type="text" id="last" placeholder="Last Name" autocomplete="family-name" />
          <svg class="warn" viewBox="0 0 24 24"><path d="M12 3 2 21h20z" /><path d="M12 10v5M12 18v.5" /></svg>
          <span class="msg">Field is required</span>
        </div>

        <button type="submit" class="btn">NEXT</button>
        <p class="policy">By clicking on the button you accept our privacy policy</p>
        <p class="success" id="success" role="status"></p>
      </form>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
